[project]
name = "trainhub"
version = "0.19.0"
description = "Launcher and monitor for training commands on remote machines (ssh → docker → venv)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.9,<2",
    "httpx>=0.27",
]

[project.scripts]
trainhub = "trainhub.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainhub"]

# Built front end, committed in web/dist (see CLAUDE.md): shipped as trainhub/static so that a
# plain `pip install .` serves the interface (api.app.find_static_dir).
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "trainhub/static"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["docker: requires a working local docker daemon"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "ASYNC109"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["trainhub"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "uvicorn.*"]
ignore_missing_imports = true
