# Playwright test inventory (fake mode, fast and deterministic simulation).
machines:
  - id: gpu-01
    label: GPU 01
    host: gpu-01.lab
  - id: gpu-down
    label: Offline machine
    host: gpu-down.lab
images:
  - id: torch
    image: registry.lab/ml/torch:2.4
venvs:
  - id: main
    path: /opt/venvs/main
projects:
  # first: the seg → det tab order of the tab tests stays as is
  - id: infer
    label: Inference
    extends: seg
    command: python infer.py --config-name {config} --ckpt {checkpoint}
    docker:
      volumes: [/out:/workspace/out]
  - id: seg
    label: Segmentation
    command: python train.py --config-name {config}
    workdir: /workspace/seg
    configs:
      root: /seg/configs
      exclude: ["hydra/*"]
  - id: det
    label: Detection
    command: python -m det.train --config-name {config}
    machines: [gpu-01]
    configs:
      discover: {path: /det/configs}
    mlflow: {enabled: false}
mlflow:
  tracking_uri: http://mlflow.e2e:5000
  poll_interval_s: 2
checkpoints:
  - id: out
    label: Outputs
    machine: gpu-01
    root: /out
simulation:
  duration_s: [600, 600]
  time_scale: 1
  log_rate: 10
  failure_prob: 0
  latency_ms: [5, 10]
  machines:
    gpu-down: down
  configs:
    seg: [baseline, unet_large, exp/sweep/lr_small, exp/sweep/lr_big, hydra/launcher/local]
    det: [yolo_s, yolo_m]
  checkpoints:
    out: [run_a, run_b, run_c]
