# TrainHub inventory: available resources (read-only).
# Path given by TRAINHUB_INVENTORY (default ./inventory.yaml), hot-reloaded.

# Docker command on the machines (default: docker). Binary, path or wrapper accepting the
# docker subcommands TrainHub uses. Can be overridden per machine.
# docker_command: sudo -n docker

# MLflow (optional): progress bar and training status of the runs, see the README.
# mlflow:
#   tracking_uri: http://mlflow.lab:5000
#   max_epochs_param: trainer.max_epochs   # parameter: maximum epoch
#   epoch_metric: epoch                    # metric: current epoch
#   # experiments: [segmentation]          # default: all

machines:
  - id: gpu-01
    label: GPU 01 (4×A100)
    host: gpu-01.lab.local      # or an alias from ~/.ssh/config
    user: alice                 # optional
    port: 22                    # optional
  - id: gpu-02
    host: gpu-02

images:
  - id: torch-2.4
    image: registry.lab/ml/torch:2.4-cuda12
  - id: torch-nightly
    image: registry.lab/ml/torch:nightly

venvs:
  - id: main
    path: /opt/venvs/main        # path INSIDE the container
  - id: exp
    path: /opt/venvs/exp
    images: [torch-nightly]      # optional: restricted to the listed images

projects:
  - id: segmentation
    label: Segmentation
    command: python train.py --config-name {config}
    workdir: /workspace/seg      # cd before the command, in the container
    # Files sourced in the container, after the venv and the cd, before the command.
    # Relative to the workdir (or absolute, or ~/…). Missing = error, unless optional: true.
    # env_files:                 # variables: "export AAA=bbb" or "AAA=bbb" (exported)
    #   - .env
    #   - {path: .env.local, optional: true}
    # source: [scripts/setup_cluster.sh]   # scripts sourced as is, after env_files
    machines: [gpu-01, gpu-02]   # optional: allowed subset (default: all)
    images: [torch-2.4]
    venvs: [main, exp]
    docker:
      gpus: all                  # --gpus
      shm_size: 16g
      volumes:
        - /data:/data:ro
        - /home/alice/seg:/workspace/seg
      env:
        WANDB_MODE: online
      extra_args: ["--ipc=host"]
      # tty: false               # disables -t (colors/progress bars)
      # tty_size: [100, 40]      # container terminal size (columns, rows): tqdm adapts to it
      # stop_timeout: 30         # docker stop -t timeout
      # keep_alive: false        # default true: the container stays started when the command
      #                          # finishes (shell from TrainHub, “Close container”)
    configs:
      # Root of the config files on the chosen machine (host side). Every *.yaml file
      # under this root (recursively) is offered as a tree.
      # A config = relative path without extension, e.g. experiments/unet_large
      # → {config} = experiments/unet_large, {config_name} = unet_large.
      root: /home/alice/seg/configs
      pattern: "*.yaml"          # optional
      exclude: ["hydra/*"]       # optional: relative paths to ignore (glob)
      # static: [baseline]       # optional: configs added to the list
    # mlflow:                    # optional: overrides the global mlflow section
    #   epoch_metric: trainer/epoch
    #   # enabled: false
