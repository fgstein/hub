# Inventory of the simulated SSH machines (make sim-up, then make dev-sim).
# The sim-gpu-01/02 aliases come from dev/ssh/config (Include it in ~/.ssh/config).
machines:
  - id: sim-gpu-01
    label: Simulated machine 1
    host: sim-gpu-01
  - id: sim-gpu-02
    label: Simulated machine 2
    host: sim-gpu-02

images:
  - id: fake-train
    label: Test image (Hydra + tqdm)
    image: trainhub-fake-train
  - id: missing
    image: trainhub-does-not-exist:latest

venvs:
  - id: main
    path: /opt/venvs/main
  - id: exp
    path: /opt/venvs/exp

projects:
  - id: fake
    label: Fake train (SSH)
    command: python train.py --config-name {config}
    workdir: /workspace/fake
    docker:
      env:
        HYDRA_FULL_ERROR: "1"
      stop_timeout: 10
    configs:
      root: /home/alice/seg/configs   # dev/fake-train/configs mounted in the machines
