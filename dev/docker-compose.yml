# Simulated SSH machines (make sim-up): sim-gpu-01 (port 2201) and sim-gpu-02 (port 2202).
# Each machine has sshd and the Docker client, with the host's Docker socket mounted.
# Test key: ./dev/gen-ssh-key.sh (dev/ssh/id_ed25519).
services:
  sim-gpu-01:
    build: ./sim-machine
    image: trainhub-sim-machine
    container_name: sim-gpu-01
    hostname: sim-gpu-01
    ports: ["127.0.0.1:2201:22"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ssh:/keys:ro
      - ./fake-train/configs:/home/alice/seg/configs:ro
  sim-gpu-02:
    image: trainhub-sim-machine
    depends_on: [sim-gpu-01]
    container_name: sim-gpu-02
    hostname: sim-gpu-02
    ports: ["127.0.0.1:2202:22"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ssh:/keys:ro
      - ./fake-train/configs:/home/alice/seg/configs:ro
