# Inventaire de développement — mode fake (TRAINHUB_EXECUTOR=fake).
# Machines et conteneurs sont simulés en mémoire ; rien n'est exécuté.
#
# Ce que montre la démo :
#   - segmentation : arborescence de configs, paramètre libre {options}, conteneur conservé
#     après la commande (shell simulé, « Fermer le conteneur »)
#   - détection    : paramètres libres {seed} et {tags}, venv « system » (toujours proposé)
#   - llm-finetune : paramètre {nproc}, conteneur supprimé à la fin (keep_alive: false)
#   - gpu-03 instable, gpu-old hors ligne, image « broken » (échec au lancement)

machines:
  - id: gpu-01
    label: GPU 01 (4×A100)
    host: gpu-01.lab.local
    user: alice
  - id: gpu-02
    label: GPU 02 (8×H100)
    host: gpu-02.lab.local
    user: alice
  - id: gpu-03
    label: GPU 03 (instable)
    host: gpu-03.lab.local
  - id: gpu-old
    label: Ancienne machine (hors ligne)
    host: gpu-old.lab.local

images:
  - id: torch-2.4
    label: PyTorch 2.4 / CUDA 12
    image: registry.lab/ml/torch:2.4-cuda12
  - id: torch-nightly
    image: registry.lab/ml/torch:nightly
  - id: broken
    label: Image absente (démo d'échec)
    image: registry.lab/ml/missing:latest

venvs:
  - id: main
    path: /opt/venvs/main
  - id: exp
    path: /opt/venvs/exp
    images: [torch-nightly]

projects:
  - id: segmentation
    label: Segmentation
    # {options} : paramètre libre, un champ dans le brouillon (ex. trainer.max_epochs=5 +seed=1)
    command: python train.py --config-name {config} {options}
    workdir: /workspace/seg
    machines: [gpu-01, gpu-02, gpu-03, gpu-old]
    docker:
      gpus: all
      shm_size: 16g
      volumes:
        - /data:/data:ro
        - /home/alice/seg:/workspace/seg
      env:
        WANDB_MODE: offline
      extra_args: ["--ipc=host"]
    configs:
      # racine des configs Hydra sur la machine : tous les *.yaml (récursif) sont proposés
      root: /home/alice/seg/configs
      pattern: "*.yaml"
      exclude: ["hydra/*", "*/_*"]

  - id: detection
    label: Détection
    command: python -m det.train --config-name {config} run.id={run_id} seed={seed} --tags {tags}
    workdir: /workspace/det
    images: [torch-2.4, torch-nightly]
    docker:
      gpus: all
      shm_size: 8g
      volumes: [/home/alice/det:/workspace/det]
    configs:
      root: /home/alice/det/configs

  - id: llm-finetune
    label: LLM fine-tune
    command: torchrun --nproc-per-node {nproc} finetune.py --config-name {config}
    workdir: /workspace/llm
    machines: [gpu-02]
    images: [torch-nightly]
    venvs: [exp]
    docker:
      gpus: all
      shm_size: 64g
      tty: false
      keep_alive: false       # conteneur non conservé : il s'arrête avec la commande
    configs:
      static: [llama_8b_lora]

simulation:
  duration_s: [60, 300]       # durée d'un entraînement simulé
  log_rate: 6                 # mises à jour de la barre de progression par seconde
  failure_prob: 0.15          # probabilité d'échec (traceback, code 1)
  time_scale: 1.0             # > 1 accélère le temps simulé
  latency_ms: [50, 300]       # latence SSH simulée
  flaky_period_s: 60
  machines:
    gpu-03: flaky             # injoignable par intermittence
    gpu-old: down             # toujours injoignable
  configs:                    # arborescence simulée sous la racine, par projet
    segmentation:
      - baseline
      - unet_large
      - ablation/lr_1e-3
      - ablation/lr_3e-4
      - ablation/no_augment
      - experiments/2026-10/unet_deep
      - experiments/2026-10/unet_wide
      - experiments/2026-09/segformer_b2
      - hydra/launcher/slurm
    detection: [yolo_s, yolo_m, detr/r50, detr/r101, rtdetr/rtdetr_l]
