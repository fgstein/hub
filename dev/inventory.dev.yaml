# Development inventory — fake mode (TRAINHUB_EXECUTOR=fake).
# Machines and containers are simulated in memory; nothing is executed.
#
# What the demo shows:
#   - segmentation: config tree, free parameter {options}, container kept after the
#     command (simulated shell, “Close container”)
#   - detection   : free parameters {seed} and {tags}, “system” venv (always offered)
#   - llm-finetune: parameter {nproc}, container removed at the end (keep_alive: false)
#   - seg-infer   : inference project (extends segmentation), command with {checkpoint}
#   - checkpoints : simulated run directories (Checkpoints tab), one source per disk
#   - gpu-03 flaky, gpu-old offline, “broken” image (launch failure)
#   - MLflow simulated (progress bar, dot color), except for llm-finetune
#   - “Machines” tab: simulated CPU (/proc) and GPU (nvidia-smi) load

machines:
  - id: gpu-01
    label: GPU 01 (4×A100)
    host: gpu-01.lab.local
    user: alice
  - id: gpu-02
    label: GPU 02 (8×H100)
    host: gpu-02.lab.local
    user: alice
  - id: gpu-03
    label: GPU 03 (flaky)
    host: gpu-03.lab.local
  - id: gpu-old
    label: Old machine (offline)
    host: gpu-old.lab.local

images:
  - id: torch-2.4
    label: PyTorch 2.4 / CUDA 12
    image: registry.lab/ml/torch:2.4-cuda12
  - id: torch-nightly
    image: registry.lab/ml/torch:nightly
  - id: broken
    label: Missing image (failure demo)
    image: registry.lab/ml/missing:latest

venvs:
  - id: main
    path: /opt/venvs/main
  - id: exp
    path: /opt/venvs/exp
    images: [torch-nightly]

# MLflow is simulated in fake mode (the URL is only used for the links).
mlflow:
  tracking_uri: http://mlflow.lab.local:5000
  max_epochs_param: trainer.max_epochs
  epoch_metric: epoch
  poll_interval_s: 3

projects:
  - id: segmentation
    label: Segmentation
    # {options}: free parameter, a field in the draft (e.g. trainer.max_epochs=5 +seed=1)
    command: python train.py --config-name {config} {options}
    workdir: /workspace/seg
    machines: [gpu-01, gpu-02, gpu-03, gpu-old]
    docker:
      gpus: all
      shm_size: 16g
      volumes:
        - /data:/data:ro
        - /home/alice/seg:/workspace/seg
      env:
        WANDB_MODE: offline
      extra_args: ["--ipc=host"]
    configs:
      # root of the Hydra configs on the machine: every *.yaml (recursive) is offered
      root: /home/alice/seg/configs
      pattern: "*.yaml"
      exclude: ["hydra/*", "*/_*"]

  - id: detection
    label: Detection
    command: python -m det.train --config-name {config} run.id={run_id} seed={seed} --tags {tags}
    workdir: /workspace/det
    images: [torch-2.4, torch-nightly]
    docker:
      gpus: all
      shm_size: 8g
      volumes: [/home/alice/det:/workspace/det]
    configs:
      root: /home/alice/det/configs

  - id: llm-finetune
    label: LLM fine-tune
    command: torchrun --nproc-per-node {nproc} finetune.py --config-name {config}
    workdir: /workspace/llm
    machines: [gpu-02]
    images: [torch-nightly]
    venvs: [exp]
    docker:
      gpus: all
      shm_size: 64g
      tty: false
      keep_alive: false       # container not kept: it stops with the command
    mlflow: {enabled: false}  # no MLflow tracking for this project
    configs:
      static: [llama_8b_lora]

  - id: seg-infer
    label: Segmentation — inference
    extends: segmentation      # machines, docker options, workdir, configs… inherited
    # {checkpoint}: path chosen in the Checkpoints tab, translated to the container path
    # through the volumes (/home/alice/seg → /workspace/seg)
    command: python infer.py --config-name {config} --ckpt {checkpoint}

checkpoints:
  - id: seg-outputs
    label: Segmentation outputs
    # no machine: shared volume, read and cleaned on the TrainHub server (no SSH)
    root: /home/alice/seg/outputs
    layout: "{name}/checkpoints/{group}/*.ckpt"
    mlflow:                    # MLflow run of each directory: the one that logged its path
      match: params.callbacks/model_checkpoint/dirpath
      inference:               # inferences made with these checkpoints (other experiment)
        match: params.ckpt_path
        experiments: [seg-inference]
        show: [params.data.dataset, params.trainer.precision]
  - id: scratch
    label: Scratch (gpu-02 only)
    machine: gpu-02            # only visible from gpu-02: find and rm run there
    root: /scratch/alice/runs
    layout: "{name}/*.pt"

simulation:
  duration_s: [60, 300]       # duration of a simulated training
  log_rate: 6                 # progress bar updates per second
  failure_prob: 0.15          # failure probability (traceback, code 1)
  time_scale: 1.0             # > 1 speeds up simulated time
  latency_ms: [50, 300]       # simulated SSH latency
  flaky_period_s: 60
  machines:
    gpu-03: flaky             # intermittently unreachable
    gpu-old: down             # always unreachable
  configs:                    # simulated tree under the root, per project
    segmentation:
      - baseline
      - unet_large
      - ablation/lr_1e-3
      - ablation/lr_3e-4
      - ablation/no_augment
      - experiments/2026-10/unet_deep
      - experiments/2026-10/unet_wide
      - experiments/2026-09/segformer_b2
      - hydra/launcher/slurm
    detection: [yolo_s, yolo_m, detr/r50, detr/r101, rtdetr/rtdetr_l]
  checkpoints:                # simulated run directories, per checkpoint source
    seg-outputs:
      - unet_large_lr1e-3
      - unet_large_lr3e-4
      - unet_deep_2026-10-12
      - segformer_b2_bs16
      - baseline_2026-10-02
      - ablation_no_augment
      - debug_crashed
