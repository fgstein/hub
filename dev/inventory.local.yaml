# Local mode inventory (TRAINHUB_EXECUTOR=local): real docker commands, without SSH.
# Requirements: local Docker access and the test image (make fake-train-image).
# Every machine runs on the local Docker; the trainhub.machine label tells their
# containers apart.

machines:
  - id: localhost
    label: Local Docker
    host: localhost
  - id: local-b
    label: Local Docker (2nd “machine”)
    host: localhost

images:
  - id: fake-train
    label: Test image (Hydra + tqdm)
    image: trainhub-fake-train
  - id: missing
    label: Missing image (failure demo)
    image: trainhub-does-not-exist:latest

venvs:
  - id: main
    path: /opt/venvs/main
  - id: exp
    path: /opt/venvs/exp

projects:
  - id: fake
    label: Fake train
    command: python train.py --config-name {config}
    workdir: /workspace/fake
    images: [fake-train, missing]
    docker:
      env:
        HYDRA_FULL_ERROR: "1"
      stop_timeout: 10
    configs:
      # local mode: root relative to the server's launch directory (repository root)
      root: dev/fake-train/configs
