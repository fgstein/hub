name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check src tests dev
      - run: uv run ruff format --check src tests dev
      - run: uv run mypy
      - name: Test image (local Docker integration)
        run: docker build -t trainhub-fake-train dev/fake-train
      - run: uv run pytest -q

  web:
    name: Front end (biome, tsc, vitest, build, playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed web/dist matches the sources (see CLAUDE.md)
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "::error::web/dist is out of date: run 'make build-web' and commit web/dist"
            exit 1
          fi
      - name: Bundle size (< 300 kB gzip excluding xterm)
        run: |
          size=$(for f in dist/assets/index-*.js; do gzip -c "$f" | wc -c; done | awk '{s+=$1} END {print s}')
          echo "main bundle: $size bytes gzip"
          test "$size" -lt 307200
      - run: uv sync --locked
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trainhub:ci .
      - name: Start in fake mode
        run: |
          docker run -d --name th -p 8420:8420 -e TRAINHUB_HOST=0.0.0.0 -e TRAINHUB_EXECUTOR=fake \
            -e TRAINHUB_INVENTORY=/etc/trainhub/inventory.example.yaml trainhub:ci
          for i in $(seq 1 30); do curl -fsS localhost:8420/api/health && exit 0; sleep 1; done
          docker logs th; exit 1
